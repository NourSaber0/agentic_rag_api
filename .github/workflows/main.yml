name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # --- NEW: Spin up a disposable Qdrant database for the test ---
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest httpx
        pip install -r requirements.txt
        
    - name: Run Pytest
      env:
        GROQ_API_KEY: "fake_groq_key"
        # Point this to the disposable database we just spun up!
        QDRANT_URL: "http://localhost:6333"
        QDRANT_API_KEY: "fake_key_is_fine_here"
      run: |
        pytest test_main.py -v
